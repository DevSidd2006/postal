services:
  postal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: postal:latest
    container_name: postal
    stdin_open: true
    tty: true
    environment:
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      TERM: ${TERM:-xterm-256color}
    volumes:
      - ${POSTAL_WORKSPACE:-..}:/workspace
      - postal-config:/config
    working_dir: /workspace

volumes:
  postal-config: